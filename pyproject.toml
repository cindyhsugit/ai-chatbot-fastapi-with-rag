[project]
name = "ai-chatbot-fastapi-with-rag"
version = "0.1.0"
description = "Multimodal LangGraph RAG pipeline with hybrid SQL/vector/image retrieval"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langgraph",
    "langchain",
    "langchain-openai",
    "langchain-google-genai",
    "langchain-huggingface",
    "langchain-experimental",
    "chromadb",
    "sentence-transformers",
    "onnxruntime",
    "optimum[onnxruntime]",
    "torch",
    "openai",
    "python-dotenv",
    "tavily-python",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-asyncio"]

[tool.pytest.ini_options]
testpaths = ["test"]